[package]
name = "v21-live"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The live bot of strategy v2.1: feeds, the fast and exact decisions, the demo account, the journal"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number the websocket writes as a JSON number is read correctly rounded, as
# Python's float() reads it (pmbot).
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
v21-core = { path = "../core" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zeroize = "~1.8"

[dev-dependencies]
flate2 = "1"
proptest = "1"
tempfile = "3.27.0"
