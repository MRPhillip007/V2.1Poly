[package]
name = "v21-live"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The live bot of strategy v2.1: feeds, the fast and exact decisions, the demo account, the journal"

[dependencies]
anyhow = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number the websocket writes as a JSON number is read correctly rounded, as
# Python's float() reads it (pmbot).
serde_json = { version = "1", features = ["float_roundtrip"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "http2"] }
# rustls on ring only: aws-lc (rustls' default) needs CMake and NASM to build on Windows
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
v21-core = { path = "../core" }
# the archive's windows, books and closes for `v21 reconcile`
v21-replay = { path = "../replay" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zeroize = "~1.8"
rtrb = "0.4.0"
core_affinity = "0.8.3"

[dev-dependencies]
axum = "0.8"
flate2 = "1"
proptest = "1"
tempfile = "3.27.0"
