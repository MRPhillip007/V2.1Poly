[package]
name = "v21-replay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The archive replay of strategy v2.1: the parquet archive through v21-core, compared with the Python backtest"

[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
csv = "1.4.0"
parquet = { version = "60.0.0", features = ["arrow"] }
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
v21-core = { path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"
